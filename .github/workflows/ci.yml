# CI for Glide: uv, ruff, offline pytest.
#
# Derived from consolidation-inputs/extension-local-archive-1/.github/workflows/ci.yml (the five archive copies of
# ci.yml are byte-identical). Dropped from the archive version: the gitleaks job (it downloads a binary over the
# network and needs a .gitleaks.toml that does not exist here), the Python 3.12 matrix leg (AGENTS.md runs 3.13).
#
# Tests are offline: tests/conftest.py refuses anything that reaches the machine, and no job here needs a secret.
#
# Required status check: the aggregate job "ci-ok" (it treats a skipped job as success). Whether the live ruleset
# requires this name, or other names, must be checked online; see .github/REVIEW_SETUP.md. Nothing here changes it.
#
# Cost: the macOS job costs about ten times the Linux rate on private repos, so it runs on manual dispatch only
# (Actions tab, Run workflow) until the owner decides to spend that. On a public repo it runs on every PR.
#
# Third-party actions are pinned to full commit SHAs. Each SHA was checked against its tag with read-only gh calls on
# 2026-10-04 (actions/checkout v7.0.1, astral-sh/setup-uv v10.2.0); uv 0.12.22 exists as a release.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: a read-only token for every job.
permissions:
  contents: read

# One run per PR or branch; a newer push cancels the older PR run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          python-version: "3.13"
          enable-cache: true

      - name: Install (uv.lock must be current)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Pytest (offline)
        run: uv run --locked pytest -q

  test-macos:
    name: test-macos
    # Private repo: manual runs only (billing). Public repo: every PR and push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          python-version: "3.13"
          enable-cache: true

      # Pulls the pyobjc and ocrmac wheels. Nothing here launches an app or touches a screen: conftest.py guards it.
      - name: Install (uv.lock must be current)
        run: uv sync --locked

      - name: Pytest (offline)
        run: uv run --locked pytest -q

  ci-ok:
    name: ci-ok
    if: ${{ !cancelled() }}
    needs: [lint-test, test-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every needed job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::a needed job ended as '${result}'"; exit 1 ;;
            esac
          done
